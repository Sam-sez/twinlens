<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TwinLens Studio — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>

<div id="loginScreen" class="admin-login">
  <div class="logo-mark" style="justify-content:center;"><div class="rings"><span></span><span></span></div>TWINLENS</div>
  <h2 style="margin-top:24px;font-size:24px;">Admin</h2>
  <input type="password" id="passwordInput" placeholder="Password" autofocus>
  <button id="loginBtn">Log in</button>
  <div class="admin-error" id="loginError"></div>
</div>

<div id="dashboard" class="admin-body" style="display:none;">
  <span class="logout" id="logoutBtn">Log out</span>
  <div class="logo-mark"><div class="rings"><span></span><span></span></div>TWINLENS ADMIN</div>

  <div class="tabs" style="margin-top:40px;">
    <div class="tab active" data-tab="bookings">Inquiries</div>
    <div class="tab" data-tab="hero">Hero</div>
    <div class="tab" data-tab="services">Services</div>
    <div class="tab" data-tab="gallery">Gallery</div>
    <div class="tab" data-tab="testimonials">Testimonials</div>
    <div class="tab" data-tab="packages">Packages</div>
  </div>

  <div class="tab-panel active" id="tab-bookings">
    <div id="bookingList"></div>
  </div>

  <div class="tab-panel" id="tab-hero">
    <div class="admin-form">
      <label>Clive (left side of hero)</label>
      <div id="heroLeftPreview" style="width:100%;aspect-ratio:16/9;background-size:cover;background-position:center;background-color:var(--ink);border:1px solid var(--line);margin-top:8px;"></div>
      <button type="button" class="upload-btn" id="uploadHeroLeftBtn">Upload / replace photo</button>
    </div>
    <div class="admin-form">
      <label>Manduna (right side of hero)</label>
      <div id="heroRightPreview" style="width:100%;aspect-ratio:16/9;background-size:cover;background-position:center;background-color:var(--ink);border:1px solid var(--line);margin-top:8px;"></div>
      <button type="button" class="upload-btn" id="uploadHeroRightBtn">Upload / replace photo</button>
    </div>
    <div class="small-note" id="heroStatus"></div>
  </div>

  <div class="tab-panel" id="tab-services">
    <div class="admin-form">
      <label>Party Vlogs</label>
      <div id="servicePartyVlogsPreview" style="width:100%;aspect-ratio:4/3;background-size:cover;background-repeat:no-repeat;background-position:center;background-color:var(--ink);border:1px solid var(--line);margin-top:8px;border-radius:4px;"></div>
      <button type="button" class="upload-btn" data-service="service_party_vlogs">Upload / replace photo</button>
    </div>
    <div class="admin-form">
      <label>Engagement Vlogs</label>
      <div id="serviceEngagementVlogsPreview" style="width:100%;aspect-ratio:4/3;background-size:cover;background-repeat:no-repeat;background-position:center;background-color:var(--ink);border:1px solid var(--line);margin-top:8px;border-radius:4px;"></div>
      <button type="button" class="upload-btn" data-service="service_engagement_vlogs">Upload / replace photo</button>
    </div>
    <div class="admin-form">
      <label>Advertising</label>
      <div id="serviceAdvertisingPreview" style="width:100%;aspect-ratio:4/3;background-size:cover;background-repeat:no-repeat;background-position:center;background-color:var(--ink);border:1px solid var(--line);margin-top:8px;border-radius:4px;"></div>
      <button type="button" class="upload-btn" data-service="service_advertising">Upload / replace photo</button>
    </div>
    <div class="admin-form">
      <label>Graduation Vlogs</label>
      <div id="serviceGraduationVlogsPreview" style="width:100%;aspect-ratio:4/3;background-size:cover;background-repeat:no-repeat;background-position:center;background-color:var(--ink);border:1px solid var(--line);margin-top:8px;border-radius:4px;"></div>
      <button type="button" class="upload-btn" data-service="service_graduation_vlogs">Upload / replace photo</button>
    </div>
    <div class="admin-form">
      <label>Graphics Design</label>
      <div id="serviceGraphicsDesignPreview" style="width:100%;aspect-ratio:4/3;background-size:cover;background-repeat:no-repeat;background-position:center;background-color:var(--ink);border:1px solid var(--line);margin-top:8px;border-radius:4px;"></div>
      <button type="button" class="upload-btn" data-service="service_graphics_design">Upload / replace photo</button>
    </div>
    <div class="admin-form">
      <label>Social Media Management</label>
      <div id="serviceSocialMediaPreview" style="width:100%;aspect-ratio:4/3;background-size:cover;background-repeat:no-repeat;background-position:center;background-color:var(--ink);border:1px solid var(--line);margin-top:8px;border-radius:4px;"></div>
      <button type="button" class="upload-btn" data-service="service_social_media">Upload / replace photo</button>
    </div>
    <div class="small-note" id="servicesStatus"></div>
  </div>

  <div class="tab-panel" id="tab-gallery">
    <div class="admin-form">
      <label>Name (optional)</label>
      <input type="text" id="galleryTitle" placeholder="e.g. Amara & Kene's Wedding">
      <label>Description (optional)</label>
      <textarea id="galleryDescription" placeholder="A short line about this shoot"></textarea>
      <button type="button" class="upload-btn" id="uploadBtn">Upload photo from your phone</button>
      <div class="small-note" id="uploadStatus"></div>
    </div>
    <div id="galleryList"></div>
  </div>

  <div class="tab-panel" id="tab-testimonials">
    <form class="admin-form" id="testimonialForm">
      <label>Quote</label>
      <textarea id="tQuote" required></textarea>
      <label>Client name</label>
      <input type="text" id="tClient" required>
      <label>Event type (optional)</label>
      <input type="text" id="tEvent" placeholder="e.g. Wedding, Portrait Session">
      <button type="submit" style="margin-top:20px;">Add testimonial</button>
    </form>
    <div id="testimonialList"></div>
  </div>

  <div class="tab-panel" id="tab-packages">
    <form class="admin-form" id="packageForm">
      <label>Package name</label>
      <input type="text" id="pTitle" placeholder="e.g. Half Day" required>
      <label>Subtitle</label>
      <input type="text" id="pSubtitle" placeholder="e.g. Intimate coverage">
      <label>Price</label>
      <input type="text" id="pPrice" placeholder="e.g. K800">
      <label>Duration</label>
      <input type="text" id="pDuration" placeholder="e.g. 6 hours">
      <label>What's included (one per line)</label>
      <textarea id="pInclusions" placeholder="Getting ready photos&#10;Ceremony&#10;Family photos"></textarea>
      <button type="submit" style="margin-top:20px;">Add package</button>
    </form>
    <div id="packageList"></div>
  </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
